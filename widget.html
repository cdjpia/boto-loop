<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boto Loop</title>
<meta name="description" content="Interactive 3D boto-aparelhagem. Drag or scroll to rotate it in any direction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<!-- three pelo CDN: o site publicado nao tem node_modules. Mesma versao do package.json. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<style>
  /* O iframe e transparente por padrao: o que aparece atras e a pagina do Framer.
     Nada de color-scheme aqui - se o iframe declarar um esquema diferente do da
     pagina, o navegador pinta um fundo opaco.

     UI kit (o mesmo do boto-loop): sem sombra, sem canto arredondado nas caixas;
     estados por preenchimento e contorno:
       selecionado      gradiente rosa, knob branco, anel rosa nas amostras
       disponivel       superficie blush, texto rosa apagado, hover escurece
       indisponivel     cinza-rosado chapado, contraste baixo, cursor not-allowed */
  :root {
    --pink-50:  #fdf3f7;
    --pink-100: #fae3ed;
    --pink-300: #eea3c3;
    --pink-400: #e87ba8;
    --pink-500: #e35a92;
    --pink-600: #cc4079;
    --ink:      #4a2a3a;
    --ink-dim:  #a5798d;
    --off-bg:   #f2ecef;
    --off-ink:  #c7b8bf;
    --surface:  #fffafc;
    --grad:     linear-gradient(135deg, #ee7dab 0%, var(--pink-500) 55%, var(--pink-600) 100%);
    --margem:   16px;
    --sw:       24px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    overflow: hidden;
    background: transparent;
    font: 13px/1.4 "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  body[data-fundo="preto"]  { background: #000; }
  body[data-fundo="branco"] { background: #fff; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--pink-600); outline-offset: 2px; }

  /* ---------------------------------------------------------------- palco
     O canvas ocupa o frame inteiro, sem proporcao fixa. Arrastar em qualquer
     direcao gira o boto, entao o toque nao rola a pagina por cima dele. */
  #view {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    opacity: 0;
    transition: opacity .6s ease;
    outline: none;
  }
  #view.pronto { opacity: 1; }
  #view.arrastando { cursor: grabbing; }

  /* ---------------------------------------------------------------- dica
     Mao que arrasta pros quatro lados, com a seta do sentido acendendo. Toca uma
     vez quando o widget entra na tela e some no primeiro toque. */
  #dica {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
  }
  #dica.visivel { opacity: 1; }
  #dica .gesto { position: relative; width: 108px; height: 108px; }
  #dica .seta { position: absolute; width: 20px; height: 20px; color: var(--pink-500); opacity: .25; }
  #dica .esq { left: 0; top: 44px; }
  #dica .dir { right: 0; top: 44px; }
  #dica .cim { top: 0; left: 44px; }
  #dica .bai { bottom: 0; left: 44px; }
  #dica .mao {
    position: absolute; left: 32px; top: 32px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--pink-500);
    color: var(--pink-500);
  }
  #dica .mao svg { width: 24px; height: 24px; }
  #dica.visivel .mao { animation: cruz 2.8s cubic-bezier(.45, 0, .55, 1) 1; }
  #dica.visivel .esq { animation: acende 2.8s ease-in-out 1; animation-delay: 0s; }
  #dica.visivel .dir { animation: acende 2.8s ease-in-out 1; animation-delay: .7s; }
  #dica.visivel .cim { animation: acende 2.8s ease-in-out 1; animation-delay: 1.4s; }
  #dica.visivel .bai { animation: acende 2.8s ease-in-out 1; animation-delay: 2.1s; }
  @keyframes cruz {
    0%, 100% { transform: translate(0, 0) scale(1); }
    5%       { transform: translate(0, 0) scale(.9); }
    15%      { transform: translate(-26px, 0) scale(.9); }
    35%      { transform: translate(26px, 0) scale(.9); }
    50%      { transform: translate(0, 0) scale(.9); }
    65%      { transform: translate(0, -26px) scale(.9); }
    85%      { transform: translate(0, 26px) scale(.9); }
    97%      { transform: translate(0, 0) scale(.9); }
  }
  @keyframes acende { 0%, 30%, 100% { opacity: .25; } 12% { opacity: 1; } }
  #dica .texto {
    padding: 5px 12px;
    background: var(--surface); border: 1px solid var(--pink-100);
    color: var(--pink-600); font-size: 12px; font-weight: 700; white-space: nowrap;
  }

  /* ---------------------------------------------------------------- painel
     Sempre guardado no botao "Adjustments"; o boto fica sempre no centro. Aberto,
     o painel entra pela lateral direita em frame deitado (desktop, tablet) e
     sobe por baixo em frame em pe (celular) - ai pode cobrir o boto. */
  #painel {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--pink-100);
    padding: 16px;
    display: grid;
    gap: 16px;
    grid-template-areas: "topo" "brilho" "giro" "fundo";
    overflow-y: auto;
    overscroll-behavior: contain;
    visibility: hidden; opacity: 0;
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  body.aberto #painel {
    visibility: visible; opacity: 1;
    transition: opacity .2s ease, transform .2s ease;
  }
  /* deitado: coluna na lateral direita, centrada na vertical, sem cobrir o botao */
  body.deitado #painel {
    right: var(--margem); top: 50%;
    width: 260px;
    max-height: calc(100% - 2 * (var(--margem) + 48px));
    transform: translate(16px, -50%);
  }
  body.deitado.aberto #painel { transform: translate(0, -50%); }
  /* em pe: folha de baixo, largura toda, logo acima do botao */
  body:not(.deitado) #painel {
    left: var(--margem); right: var(--margem);
    bottom: calc(var(--margem) + 48px);
    max-height: calc(100% - 2 * var(--margem) - 48px);
    padding: 14px;
    gap: 12px 16px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "topo topo" "brilho fundo" "giro giro";
    transform: translateY(16px);
  }
  body:not(.deitado).aberto #painel { transform: none; }
  .topo { grid-area: topo; display: flex; align-items: center; justify-content: space-between; }
  .topo h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .s-brilho { grid-area: brilho; }
  .s-giro { grid-area: giro; }
  .s-fundo { grid-area: fundo; }

  /* botao: canto inferior direito no desktop, centro embaixo no celular */
  #ajustes {
    position: fixed; right: var(--margem); bottom: var(--margem);
    height: 38px; padding: 0 14px 0 12px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--pink-100);
    color: var(--pink-600); font-weight: 700; font-size: 12.5px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  body:not(.deitado) #ajustes { right: auto; left: 50%; transform: translateX(-50%); }
  #ajustes svg { width: 16px; height: 16px; }
  #ajustes:hover { background: var(--pink-50); }
  body.aberto #ajustes { background: var(--grad); color: #fff; border-color: transparent; }
  body.sem-ui #painel, body.sem-ui #ajustes { display: none !important; }

  .icone {
    width: 28px; height: 28px;
    background: var(--pink-50); border: 1px solid var(--pink-100); color: var(--pink-400);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icone:hover { color: var(--pink-600); background: var(--pink-100); }
  .icone svg { width: 14px; height: 14px; }

  .rotulo {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 22px; margin-bottom: 6px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-dim); white-space: nowrap;
  }
  .rotulo output {
    font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none;
    font-weight: 700; color: var(--pink-500);
  }
  .rotulo.off output { color: var(--off-ink); }

  .amostras { display: flex; flex-wrap: wrap; gap: 7px; padding: 3px; margin: -3px; }
  .amostra {
    width: var(--sw); height: var(--sw); border-radius: 50%;
    border: 0; padding: 0; cursor: pointer; flex: none;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(74, 42, 58, .14);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .amostra:hover { transform: scale(1.1); }
  .amostra[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--pink-500); }
  .amostra.xadrez { background: repeating-conic-gradient(#e4d9de 0 25%, #fff 0 50%) 50% / 10px 10px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; display: block;
    width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer;
    --fill: var(--pink-500); --track: var(--pink-100); --thumb-line: var(--pink-500);
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 999px;
    background: linear-gradient(to right, var(--fill) var(--p, 50%), var(--track) var(--p, 50%));
  }
  input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--track); }
  input[type="range"]::-moz-range-progress { height: 8px; border-radius: 999px; background: var(--fill); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%; margin-top: -6px;
    background: #fff; border: 4px solid var(--thumb-line);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 4px solid var(--thumb-line);
  }
  input[type="range"]:disabled {
    cursor: not-allowed;
    --fill: var(--off-ink); --track: var(--off-bg); --thumb-line: var(--off-ink);
  }

  .chave {
    position: relative; width: 40px; height: 22px; flex: none;
    border-radius: 999px; padding: 0; cursor: pointer;
    background: var(--pink-50); border: 1px solid var(--pink-100);
    transition: background .2s ease, border-color .2s ease;
  }
  .chave::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--pink-300);
    transition: transform .2s ease, background .2s ease;
  }
  .chave:hover::after { background: var(--pink-400); }
  .chave[aria-checked="true"] { background: var(--grad); border-color: transparent; }
  .chave[aria-checked="true"]::after { transform: translateX(18px); background: #fff; }
  .giro-titulo { display: flex; align-items: center; gap: 8px; }

  .erro { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce) {
    #view, #dica, #painel, .amostra, .chave, .chave::after { transition: none !important; }
    #dica.visivel * { animation: none !important; }
  }
</style>
</head>
<body class="deitado" data-fundo="transparente">
  <canvas id="view" tabindex="0" role="img" aria-label="3D boto. Drag, scroll or use the arrow keys to rotate."></canvas>

  <div id="dica" aria-hidden="true">
    <div class="gesto">
      <svg class="seta esq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <svg class="seta dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      <svg class="seta cim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      <svg class="seta bai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <div class="mao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10V9a1.5 1.5 0 0 1 3 0v2"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.8-2.4L4.3 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg>
      </div>
    </div>
    <div class="texto">Drag or scroll to rotate</div>
  </div>

  <button id="ajustes" type="button" aria-controls="painel" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    Adjustments
  </button>

  <section id="painel" aria-label="Adjustments">
    <div class="topo">
      <h2>Adjustments</h2>
      <button id="fechar" class="icone" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="s-brilho">
      <label class="rotulo" for="brilho"><span>Glow</span><output id="brilho-v"></output></label>
      <input id="brilho" type="range" min="0" max="1.5" step="0.01">
    </div>

    <div class="s-giro">
      <div class="rotulo" id="r-giro">
        <span class="giro-titulo">
          <span id="r-girar">Auto-spin</span>
          <button id="girar" class="chave" type="button" role="switch" aria-labelledby="r-girar"></button>
        </span>
        <output id="velocidade-v"></output>
      </div>
      <input id="velocidade" type="range" min="4" max="120" step="1" aria-label="Spin speed">
    </div>

    <div class="s-fundo">
      <div class="rotulo" id="r-fundo"><span>Background</span><output id="fundo-v"></output></div>
      <div class="amostras" id="amostras-fundo" role="group" aria-labelledby="r-fundo"></div>
    </div>
  </section>

  <script type="module" src="./src/widget.js"></script>
</body>
</html>
